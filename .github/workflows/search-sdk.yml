name: Search SDK CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/search-sdk/**'
      - '.github/workflows/search-sdk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/search-sdk/**'

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 用 runner 预装 node 先启用 corepack，确保 pnpm 在 PATH 上
      #（setup-node@v5 检测到 pnpm-workspace 时会调用 pnpm，必须先就绪）
      - name: Enable pnpm (corepack, pre-installed node)
        run: |
          node --version
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx turbo run lint --filter=@skillhub/search-sdk

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 用 runner 预装 node 先启用 corepack，确保 pnpm 在 PATH 上
      #（setup-node@v5 检测到 pnpm-workspace 时会调用 pnpm，必须先就绪）
      - name: Enable pnpm (corepack, pre-installed node)
        run: |
          node --version
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build search-sdk
        run: npx turbo run build --filter=@skillhub/search-sdk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: search-sdk-dist
          path: packages/search-sdk/dist/
          retention-days: 7

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 用 runner 预装 node 先启用 corepack，确保 pnpm 在 PATH 上
      #（setup-node@v5 检测到 pnpm-workspace 时会调用 pnpm，必须先就绪）
      - name: Enable pnpm (corepack, pre-installed node)
        run: |
          node --version
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npx turbo run build --filter=@skillhub/search-sdk

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run ci:version
          publish: pnpm run ci:publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
