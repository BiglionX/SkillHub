name: Tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 用 runner 预装 node 先启用 corepack，确保 pnpm 在 PATH 上
      #（setup-node@v5 检测到 pnpm-workspace 时会调用 pnpm，必须先就绪）
      - name: Enable pnpm (corepack, pre-installed node)
        run: |
          node --version
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @skillhub/web run db:generate

      - name: Run unit tests
        run: pnpm --filter @skillhub/web run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DIRECT_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test-secret
          NEXTAUTH_URL: http://localhost:3000

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 用 runner 预装 node 先启用 corepack，确保 pnpm 在 PATH 上
      #（setup-node@v5 检测到 pnpm-workspace 时会调用 pnpm，必须先就绪）
      - name: Enable pnpm (corepack, pre-installed node)
        run: |
          node --version
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @skillhub/web run db:generate

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          working-directory: apps/web
          start: pnpm dev
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DIRECT_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test-secret
          NEXTAUTH_URL: http://localhost:3000
