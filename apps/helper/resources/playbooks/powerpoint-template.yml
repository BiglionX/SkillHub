# PowerPoint 模板剧本（M2 内置白名单 #5）
# 复制 .potx 到 Office 模板目录

id: powerpoint-template@v1
software: powerpoint
description: 安装 PowerPoint 模板
preflight:
  - detect: software
  - ensure-disk-space: 30MB

steps:
  - id: download
    type: http
    description: 下载模板包
    url: ${skill.download_url}
    sha256: ${skill.checksum}
    to: ${temp_dir}/template.zip

  - id: extract
    type: extract
    archive: ${temp_dir}/template.zip
    to: ${temp_dir}/template

  - id: copy-template
    type: copy
    description: 复制到 PowerPoint 模板目录
    from: ${temp_dir}/template/${skill.entry}
    to: ${software.path}/Document Themes/${skill.name}.potx

  - id: verify
    type: file-exists
    path: ${software.path}/Document Themes/${skill.name}.potx

success:
  message: "安装成功！在 PowerPoint「文件 > 新建 > 个人」中可找到「${skill.name}」。"
  cta:
    label: "打开 PPT 模板目录"
    action: open-path:${software.path}/Document Themes

failure:
  rollback: true