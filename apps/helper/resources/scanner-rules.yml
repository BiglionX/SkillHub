#   2. 当前 15 个新增中，6 个（word/webstorm/intellij/pycharm/cursor/chrome）已在 seed-skills.json 手工挂 Slug，
#      其余 9 个（vs/edge/slack/dingtalk/wecom/discord/zoom/obsidian/wechat）Section 2 有路径但无按钮，等 M3 填种子
